<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">FH-HVAC fan: relay + brushed DC motor (bench wiring)</text>

  <!-- ESP32 -->
  <rect x="30" y="70" width="150" height="190" rx="8" fill="#e8eef7" stroke="#345"/>
  <text x="60" y="95" font-weight="bold">ESP32</text>
  <text x="45" y="140">GPIO 26</text>
  <text x="45" y="200">5V (VIN)</text>
  <text x="45" y="240">GND</text>

  <!-- relay -->
  <rect x="270" y="70" width="170" height="190" rx="8" fill="#fdf1dc" stroke="#543"/>
  <text x="320" y="95" font-weight="bold">Relay module</text>
  <text x="285" y="140">IN</text>
  <text x="285" y="175">VCC</text>
  <text x="285" y="205">GND</text>
  <text x="385" y="125">COM</text>
  <text x="385" y="165">NO</text>
  <text x="385" y="205">NC (unused)</text>

  <!-- ESP -> relay signal -->
  <line x1="180" y1="136" x2="270" y2="136" stroke="#d6761c" stroke-width="3"/>
  <line x1="180" y1="196" x2="230" y2="196" stroke="#c22" stroke-width="3"/>
  <line x1="230" y1="196" x2="230" y2="171" stroke="#c22" stroke-width="3"/>
  <line x1="230" y1="171" x2="270" y2="171" stroke="#c22" stroke-width="3"/>
  <line x1="180" y1="236" x2="250" y2="236" stroke="#222" stroke-width="3"/>
  <line x1="250" y1="236" x2="250" y2="201" stroke="#222" stroke-width="3"/>
  <line x1="250" y1="201" x2="270" y2="201" stroke="#222" stroke-width="3"/>

  <!-- motor supply -->
  <rect x="560" y="60" width="150" height="70" rx="8" fill="#e6f4e6" stroke="#252"/>
  <text x="575" y="88" font-weight="bold">Motor supply</text>
  <text x="575" y="110">own source, rated</text>
  <text x="575" y="126">for the motor</text>
  <text x="600" y="150" fill="#c22">+</text>
  <text x="672" y="148">- (to GND)</text>

  <!-- supply + to COM -->
  <polyline points="610,130 610,165 520,165 520,120 440,120" fill="none" stroke="#c22" stroke-width="3"/>
  <text x="525" y="158" fill="#c22" font-size="12">supply +</text>

  <!-- NO to motor -->
  <line x1="440" y1="160" x2="470" y2="160" stroke="#d6761c" stroke-width="3"/>
  <polyline points="470,160 470,300 560,300" fill="none" stroke="#d6761c" stroke-width="3"/>

  <!-- motor -->
  <circle cx="610" cy="300" r="40" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="598" y="306" font-size="20" font-weight="bold">M</text>
  <text x="560" y="360">DC motor + fan blade</text>
  <circle cx="570" cy="300" r="4" fill="#333"/><circle cx="650" cy="300" r="4" fill="#333"/>

  <!-- motor return to supply - -->
  <polyline points="650,300 690,300 690,150 664,150 664,135" fill="none" stroke="#222" stroke-width="3"/>

  <!-- flyback diode across motor -->
  <polyline points="570,300 570,255 650,255 650,300" fill="none" stroke="#7a3fa0" stroke-width="2"/>
  <polygon points="620,243 620,267 600,255" fill="#7a3fa0"/>
  <line x1="598" y1="243" x2="598" y2="267" stroke="#7a3fa0" stroke-width="3"/>
  <text x="520" y="236" fill="#7a3fa0" font-size="12">flyback diode</text>
  <text x="520" y="250" fill="#7a3fa0" font-size="12">stripe toward +</text>

  <!-- common ground -->
  <polyline points="664,135 664,395 90,395 90,260" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="388" font-size="12">common ground: supply - tied to ESP32 GND</text>
  <text x="110" y="330" font-size="12">Do not power the motor from the</text>
  <text x="110" y="346" font-size="12">ESP32 3.3V or 5V pin.</text>
</svg>
