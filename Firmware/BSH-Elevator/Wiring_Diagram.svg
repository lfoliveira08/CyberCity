<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="1180" fill="#ffffff"/>

  <text x="600" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">BSH-Elevator — Wiring Diagram (Phase A bench build)</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" fill="#555">Logical wiring reference — connect by GPIO number and match to your ESP32 board's own silkscreen labels. Not a physical pin-layout diagram.</text>

  <!-- ESP32 board -->
  <rect x="950" y="60" width="200" height="860" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2"/>
  <text x="1050" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">ESP32 DevKit</text>
  <text x="1050" y="104" text-anchor="middle" font-size="12" fill="#555">(BSH-Elevator node)</text>

  <!-- ================= Floor 1 button ================= -->
  <rect x="50" y="90" width="220" height="90" rx="6" fill="#fff8e1" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Floor 1</text>
  <text x="160" y="134" text-anchor="middle" font-size="12" fill="#555">Push Button</text>
  <text x="245" y="114" text-anchor="end" font-size="11" fill="#333">leg A</text>
  <text x="245" y="164" text-anchor="end" font-size="11" fill="#333">leg B</text>
  <circle cx="270" cy="110" r="4" fill="#e6b800"/>
  <circle cx="270" cy="160" r="4" fill="#000000"/>
  <line x1="270" y1="110" x2="950" y2="110" stroke="#e6b800" stroke-width="2"/>
  <line x1="270" y1="160" x2="950" y2="160" stroke="#000000" stroke-width="2"/>
  <circle cx="950" cy="110" r="4" fill="#e6b800"/>
  <circle cx="950" cy="160" r="4" fill="#000000"/>
  <text x="965" y="114" font-size="13" fill="#111">GPIO 4</text>
  <text x="965" y="164" font-size="13" fill="#111">GND</text>

  <!-- ================= Floor 2 button ================= -->
  <rect x="50" y="190" width="220" height="90" rx="6" fill="#fff8e1" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="160" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Floor 2</text>
  <text x="160" y="234" text-anchor="middle" font-size="12" fill="#555">Push Button</text>
  <text x="245" y="214" text-anchor="end" font-size="11" fill="#333">leg A</text>
  <text x="245" y="264" text-anchor="end" font-size="11" fill="#333">leg B</text>
  <circle cx="270" cy="210" r="4" fill="#e6b800"/>
  <circle cx="270" cy="260" r="4" fill="#000000"/>
  <line x1="270" y1="210" x2="950" y2="210" stroke="#e6b800" stroke-width="2"/>
  <line x1="270" y1="260" x2="950" y2="260" stroke="#000000" stroke-width="2"/>
  <circle cx="950" cy="210" r="4" fill="#e6b800"/>
  <circle cx="950" cy="260" r="4" fill="#000000"/>
  <text x="965" y="214" font-size="13" fill="#111">GPIO 16</text>
  <text x="965" y="264" font-size="13" fill="#111">GND</text>

  <!-- ================= Floor 3 button ================= -->
  <rect x="50" y="290" width="220" height="90" rx="6" fill="#fff8e1" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="160" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Floor 3</text>
  <text x="160" y="334" text-anchor="middle" font-size="12" fill="#555">Push Button</text>
  <text x="245" y="314" text-anchor="end" font-size="11" fill="#333">leg A</text>
  <text x="245" y="364" text-anchor="end" font-size="11" fill="#333">leg B</text>
  <circle cx="270" cy="310" r="4" fill="#e6b800"/>
  <circle cx="270" cy="360" r="4" fill="#000000"/>
  <line x1="270" y1="310" x2="950" y2="310" stroke="#e6b800" stroke-width="2"/>
  <line x1="270" y1="360" x2="950" y2="360" stroke="#000000" stroke-width="2"/>
  <circle cx="950" cy="310" r="4" fill="#e6b800"/>
  <circle cx="950" cy="360" r="4" fill="#000000"/>
  <text x="965" y="314" font-size="13" fill="#111">GPIO 17</text>
  <text x="965" y="364" font-size="13" fill="#111">GND</text>

  <text x="60" y="405" font-size="11" fill="#777">All 3 buttons: INPUT_PULLUP in firmware — leg A to GPIO, leg B to GND. No external resistor needed.</text>

  <!-- ================= I2C LCD ================= -->
  <rect x="50" y="420" width="220" height="160" rx="6" fill="#e8f0fe" stroke="#1a4d8f" stroke-width="1.5"/>
  <text x="160" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">16x2 I2C LCD</text>
  <text x="160" y="464" text-anchor="middle" font-size="12" fill="#555">(0x27 backpack)</text>
  <text x="245" y="444" text-anchor="end" font-size="11" fill="#333">SDA</text>
  <text x="245" y="494" text-anchor="end" font-size="11" fill="#333">SCL</text>
  <text x="245" y="544" text-anchor="end" font-size="11" fill="#333">VCC</text>
  <text x="245" y="564" text-anchor="end" font-size="11" fill="#333">GND</text>
  <circle cx="270" cy="440" r="4" fill="#2e7d32"/>
  <circle cx="270" cy="490" r="4" fill="#1565c0"/>
  <circle cx="270" cy="540" r="4" fill="#c62828"/>
  <circle cx="270" cy="560" r="4" fill="#000000"/>
  <line x1="270" y1="440" x2="950" y2="440" stroke="#2e7d32" stroke-width="2"/>
  <line x1="270" y1="490" x2="950" y2="490" stroke="#1565c0" stroke-width="2"/>
  <line x1="270" y1="540" x2="950" y2="540" stroke="#c62828" stroke-width="2"/>
  <line x1="270" y1="560" x2="950" y2="560" stroke="#000000" stroke-width="2"/>
  <circle cx="950" cy="440" r="4" fill="#2e7d32"/>
  <circle cx="950" cy="490" r="4" fill="#1565c0"/>
  <circle cx="950" cy="540" r="4" fill="#c62828"/>
  <circle cx="950" cy="560" r="4" fill="#000000"/>
  <text x="965" y="444" font-size="13" fill="#111">GPIO 21 (SDA)</text>
  <text x="965" y="494" font-size="13" fill="#111">GPIO 22 (SCL)</text>
  <text x="965" y="544" font-size="13" fill="#111">5V</text>
  <text x="965" y="564" font-size="13" fill="#111">GND</text>

  <text x="60" y="600" font-size="11" fill="#777">Blank display? Check I2C address first (some backpacks are 0x3F) before assuming a firmware bug.</text>

  <!-- ================= L293D Motor Driver ================= -->
  <rect x="50" y="615" width="220" height="190" rx="6" fill="#fdecea" stroke="#8f2c1c" stroke-width="1.5"/>
  <text x="160" y="643" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">L293D</text>
  <text x="160" y="659" text-anchor="middle" font-size="12" fill="#555">Motor Driver</text>
  <text x="245" y="639" text-anchor="end" font-size="11" fill="#333">ENABLE</text>
  <text x="245" y="689" text-anchor="end" font-size="11" fill="#333">DIRA</text>
  <text x="245" y="739" text-anchor="end" font-size="11" fill="#333">DIRB</text>
  <text x="245" y="789" text-anchor="end" font-size="11" fill="#333">GND</text>
  <circle cx="270" cy="635" r="4" fill="#ef6c00"/>
  <circle cx="270" cy="685" r="4" fill="#2e7d32"/>
  <circle cx="270" cy="735" r="4" fill="#c62828"/>
  <circle cx="270" cy="785" r="4" fill="#000000"/>
  <line x1="270" y1="635" x2="950" y2="635" stroke="#ef6c00" stroke-width="2"/>
  <line x1="270" y1="685" x2="950" y2="685" stroke="#2e7d32" stroke-width="2"/>
  <line x1="270" y1="735" x2="950" y2="735" stroke="#c62828" stroke-width="2"/>
  <line x1="270" y1="785" x2="950" y2="785" stroke="#000000" stroke-width="2"/>
  <circle cx="950" cy="635" r="4" fill="#ef6c00"/>
  <circle cx="950" cy="685" r="4" fill="#2e7d32"/>
  <circle cx="950" cy="735" r="4" fill="#c62828"/>
  <circle cx="950" cy="785" r="4" fill="#000000"/>
  <text x="965" y="639" font-size="13" fill="#111">GPIO 18 (PWM)</text>
  <text x="965" y="689" font-size="13" fill="#111">GPIO 19</text>
  <text x="965" y="739" font-size="13" fill="#111">GPIO 5</text>
  <text x="965" y="789" font-size="13" fill="#111">GND</text>

  <!-- L293D bottom: motor + external supply, NOT connected to ESP32 -->
  <circle cx="100" cy="805" r="4" fill="#555555"/>
  <circle cx="160" cy="805" r="4" fill="#555555"/>
  <circle cx="220" cy="805" r="4" fill="#c62828"/>
  <line x1="100" y1="805" x2="100" y2="840" stroke="#555555" stroke-width="2"/>
  <line x1="160" y1="805" x2="160" y2="840" stroke="#555555" stroke-width="2"/>
  <line x1="220" y1="805" x2="220" y2="840" stroke="#c62828" stroke-width="2"/>

  <rect x="50" y="840" width="140" height="70" rx="6" fill="#f3f3f3" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="868" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">DC Motor</text>
  <text x="120" y="884" text-anchor="middle" font-size="10" fill="#555">(cab winch)</text>

  <rect x="200" y="840" width="260" height="70" rx="6" fill="#fff3e0" stroke="#8a4b00" stroke-width="1.5"/>
  <text x="330" y="862" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">External 5-6V Supply</text>
  <text x="330" y="878" text-anchor="middle" font-size="10" fill="#555">Motor power ONLY — never from ESP32 3V3/5V.</text>
  <text x="330" y="892" text-anchor="middle" font-size="10" fill="#555">Supply GND ties to the same common GND as ESP32 + L293D.</text>

  <text x="60" y="928" font-size="11" fill="#777">Full specs / hazards: Firmware/BSH-Elevator/{Push_Buttons,I2C_LCD_Display,L293D_Motor_Driver}/Wiring.md</text>
  <text x="60" y="946" font-size="11" fill="#777">Build order: Push Buttons -&gt; I2C LCD -&gt; L293D Motor Driver (Firmware/BSH_Elevator_Bringup_Checklist.md)</text>
  <text x="60" y="964" font-size="11" fill="#777">Speed/timing calibration procedure: L293D_Motor_Driver/Wiring.md, "Speed / Timing Calibration" section.</text>

  <!-- ================= Optional bench debug LEDs ================= -->
  <line x1="40" y1="985" x2="1160" y2="985" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="1010" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Optional -- Bench Debug LEDs (same idea as the Wokwi simulation)</text>
  <text x="600" y="1028" text-anchor="middle" font-size="12" fill="#555">Dedicated GPIO pins -- NOT shared with the L293D control lines above. Firmware mirrors each L293D signal onto its matching LED pin (a few extra lines of code, see note below).</text>

  <!-- ENABLE / yellow -->
  <text x="60" y="1059" font-size="13" fill="#111">GPIO 23 (debug, mirrors 18)</text>
  <line x1="290" y1="1055" x2="325" y2="1055" stroke="#ef6c00" stroke-width="2"/>
  <rect x="325" y="1048" width="30" height="14" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="340" y="1043" text-anchor="middle" font-size="10" fill="#333">220&#8486;</text>
  <line x1="355" y1="1055" x2="385" y2="1055" stroke="#ef6c00" stroke-width="2"/>
  <circle cx="395" cy="1055" r="8" fill="#e6b800" stroke="#333" stroke-width="1"/>
  <line x1="403" y1="1055" x2="430" y2="1055" stroke="#000000" stroke-width="2"/>
  <text x="437" y="1059" font-size="13" fill="#111">GND</text>
  <text x="505" y="1059" font-size="11" fill="#777">Firmware: ledcWrite(23, same duty as GPIO 18) -- mirrors Wokwi "led_en"</text>

  <!-- DIRA / green -->
  <text x="60" y="1099" font-size="13" fill="#111">GPIO 25 (debug, mirrors 19)</text>
  <line x1="290" y1="1095" x2="325" y2="1095" stroke="#2e7d32" stroke-width="2"/>
  <rect x="325" y="1088" width="30" height="14" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="340" y="1083" text-anchor="middle" font-size="10" fill="#333">220&#8486;</text>
  <line x1="355" y1="1095" x2="385" y2="1095" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="395" cy="1095" r="8" fill="#2e7d32" stroke="#333" stroke-width="1"/>
  <line x1="403" y1="1095" x2="430" y2="1095" stroke="#000000" stroke-width="2"/>
  <text x="437" y="1099" font-size="13" fill="#111">GND</text>
  <text x="505" y="1099" font-size="11" fill="#777">Firmware: digitalWrite(25, same value as GPIO 19) -- mirrors Wokwi "led_dira"</text>

  <!-- DIRB / red -->
  <text x="60" y="1139" font-size="13" fill="#111">GPIO 27 (debug, mirrors 5)</text>
  <line x1="290" y1="1135" x2="325" y2="1135" stroke="#c62828" stroke-width="2"/>
  <rect x="325" y="1128" width="30" height="14" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="340" y="1123" text-anchor="middle" font-size="10" fill="#333">220&#8486;</text>
  <line x1="355" y1="1135" x2="385" y2="1135" stroke="#c62828" stroke-width="2"/>
  <circle cx="395" cy="1135" r="8" fill="#c62828" stroke="#333" stroke-width="1"/>
  <line x1="403" y1="1135" x2="430" y2="1135" stroke="#000000" stroke-width="2"/>
  <text x="437" y="1139" font-size="13" fill="#111">GND</text>
  <text x="505" y="1139" font-size="11" fill="#777">Firmware: digitalWrite(27, same value as GPIO 5) -- mirrors Wokwi "led_dirb"</text>

  <text x="600" y="1168" text-anchor="middle" font-size="11" fill="#777">GPIO 23/25/27 are free on this board (not used by buttons, LCD, or the L293D) -- see L293D_Motor_Driver/Wiring.md for the firmware mirroring note.</text>
</svg>
